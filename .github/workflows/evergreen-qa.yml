# Disposable Evergreen QA fixture; do not merge.
name: Evergreen QA
on:
  push:
    branches: ["qa/evergreen-*"]
permissions: {}
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check fixture
        env:
          EXPECTED: ready
          ACTUAL: ready
        run: test "$ACTUAL" = "$EXPECTED"
